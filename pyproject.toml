[project]
name = "jark-eurosat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "konnorewing", email = "konnorewing@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "great-tables>=1.1.0",
    "kaleido>=1.5.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "selenium>=4.53.0",
]

[project.scripts]
jark-eurosat = "jark_eurosat:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
